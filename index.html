<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Security</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <form>
        <p>
        <fieldset>
            <legend>Account Security</legend>
            <p> <label for="Student Registration ID">Student Registration ID:</label>
                <input type="text" placeholder="e.g.,C1250024">
            </p>
            <p> <label for="Academic Email Address:">Academic Email Address:</label>
                <input type="email" placeholder="username@just.edu.so">
            </p>
            <p> <label for="Portal Password">Portal Password:</label>
                <input type="password" placeholder="Enter Secret Passcode">
            </p>
            <p>
                <label for="country">country:</label>
                <select name="country" id="country">
                    <option value="">--select country--</option>
                    <option value="somalia">somalia</option>
                    <option value="kenya">kenya</option>
                    <option value="USA">USA</option>
                    <option value="QATAR">QATAR</option>
                    <option value="Saudi">Saudi</option>
                    <option value="Ethiopa">Ethiopa</option>
                    <option value="Uganda">Uganda</option>
                </select>
            </p>
        </fieldset>
        </p>
        <p>
        <fieldset>
            <legend>Shift Selection (Exclusive Choice)</legend>
            <p><input type="radio" name="shift" id="morning" checked>
                <label for="morning">morning Shift (7:30 AM - 12:30 PM)</label>
            </p>
            <input type="radio" name="shift" id="Afternoon" checked>
            <label for="Afternoon shift"> Afternoon shift(01:00 PM - 05:00 PM)</label>

        </fieldset>
        </p>
        <p>
        <fieldset>
            <legend>IT Core Electives(Multi-selection)</legend>
            <p> <input type="checkbox" id="web">
                <label for="web">HTML5 & CSS3 Web Architecture (Default Selected)</label>
            </p>
            <p> <input type="checkbox" id="python">
                <label for="Python">Python Data Science Engineering</label>
            </p>
            <p> <input type="checkbox" id="sql">
                <label for="sql">Relational Database sql operations</label>
            </p>


        </fieldset>


        </p>

        <button type="submit">Clear</button>
        <button type="submit">Submit Registration</button>
    </form>

</body>

</html>
